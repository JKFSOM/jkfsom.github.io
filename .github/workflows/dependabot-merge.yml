name: Merge Dependabot updates

# Runs after the Test workflow passes. It never checks out the pull request's
# code, so it can safely hold a write token.
on:
  workflow_run:
    workflows: [Test]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.workflow_run.pull_requests[0].number }}
    steps:
      - run: gh pr merge "$PR" --squash --delete-branch
      # A merge made with this token cannot start other workflows.
      - run: gh workflow run deploy.yml --ref dev
